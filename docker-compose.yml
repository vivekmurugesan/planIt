version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: planit-db
    environment:
      POSTGRES_USER: planit
      POSTGRES_PASSWORD: planit_password_123
      POSTGRES_DB: planit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planit-backend
    environment:
      DATABASE_URL: postgresql://planit:planit_password_123@postgres:5432/planit
      JWT_SECRET: your-secret-key-change-in-production
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planit-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
